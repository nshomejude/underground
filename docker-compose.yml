name: underground

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "Underground Network"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?set APP_KEY — generate one with: php artisan key:generate --show}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-underground}"
      DB_USERNAME: "${DB_USERNAME:-underground}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD to match the mysql service}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-underground}"
      MYSQL_USER: "${DB_USERNAME:-underground}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD to match the app service}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - underground-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  underground-mysql-data:
